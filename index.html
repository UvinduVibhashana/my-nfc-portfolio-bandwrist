<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Profile</title>
    <style>
        /* Mobile එකට ගැලපෙන විදිහට Design එක */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }
        .name {
            font-size: 24px;
            margin: 0;
            color: #333;
        }
        .bio {
            color: #666;
            font-size: 14px;
            margin: 15px 0;
            line-height: 1.5;
        }
        .links a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .links a:hover {
            background: #0056b3;
        }
        #error-msg {
            color: red;
            display: none;
            font-weight: bold;
        }
        /* Loading වෙද්දි පෙන්වන එක */
        #loading {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-card" id="card-content" style="display: block;">
        <img id="user-img" class="profile-pic" src="" alt="Profile Picture">
        <h1 id="user-name" class="name"></h1>
        <p id="user-bio" class="bio"></p>
        <div id="user-links" class="links"></div>
    </div>

    <p id="loading">Loading Profile...</p>
    <p id="error-msg">Profile not found or invalid NFC tag!</p>

     <script>
        // Database එකක් නැති නිසා දැනට පාවිච්චි කරන සාම්පල් දත්ත
         /*
        const dummyDatabase = {
            "101": {
                name: "Uvindu Vibhashana",
                bio: "Computer Science Undergraduate | CEYLO Founder",
                img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png", // දැනට සාමාන්‍ය පින්තූරයක් දාලා තියෙන්නේ
                links: [
                    { title: "My Portfolio", url: "#" },
                    { title: "Facebook", url: "#" },
                    { title: "Instagram", url: "#" }
                ]
            },
            "102": {
                name: "Kamal Perera",
                bio: "Freelance Photographer & Video Editor",
                img: "https://cdn-icons-png.flaticon.com/512/3135/3135768.png",
                links: [
                    { title: "Book a Shoot", url: "#" },
                    { title: "Instagram", url: "#" }
                ]
            }
        };

        // URL එකෙන් 'uid' කියන කෑල්ල ගන්නවා
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');

        const cardContent = document.getElementById('card-content');
        const loadingText = document.getElementById('loading');
        const errorText = document.getElementById('error-msg');

        // පොඩි ප්‍රමාදයක් (delay) දෙනවා සැබෑ App එකක් වගේ පේන්න
        setTimeout(() => {
            loadingText.style.display = 'none';

            if (uid && dummyDatabase[uid]) {
                // UID එක හරි නම් විස්තර ටික පෙන්නනවා
                const user = dummyDatabase[uid];
                
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-bio').textContent = user.bio;
                document.getElementById('user-img').src = user.img;
                
                const linksContainer = document.getElementById('user-links');
                user.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.textContent = link.title;
                    linksContainer.appendChild(a);
                });

                cardContent.style.display = 'block';
            } else {
                // UID එක වැරදි නම් හෝ නැත්නම් Error එක පෙන්නනවා
                errorText.style.display = 'block';
            }
        }, 800); // තත්පර 0.8ක delay එකක්
    </script>

</body>
</html>
