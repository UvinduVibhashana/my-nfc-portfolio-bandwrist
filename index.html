<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart NFC Portfolio</title>
    <!-- Icons ගෙනාවෙ මෙතනින් -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .mobile-container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .cover-image {
            width: 100%;
            height: 180px;
            background-image: url('tapxbackground.jpeg');
            background-size: cover;
            background-position: center;
        }

        .profile-content {
            padding: 0 20px 20px;
            text-align: center;
            position: relative;
            background: white;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: -30px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid white;
            margin-top: -55px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 10px 0 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .title {
            color: #666;
            margin: 5px 0 15px;
            font-size: 14px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f4f6f8;
            color: #6a7489;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .social-icon:hover {
            background-color: #1c2331;
            color: white;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-btn {
            background-color: #1c2331;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-radius: 20px;
            overflow: hidden;
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
        }
        .description {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            margin: 0 15px 25px;
            text-align: center;
        }
        
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Cover Image -->
        <div class="cover-image"></div>
        
        <div class="profile-content">
            <!-- Profile Picture -->
            <img class="avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=500&auto=format&fit=crop" alt="Profile">
            
            <h1 id="userName">Emily Johnson</h1>
            <p class="title" id="userRole">Professional Photographer</p>
            <br>
            <br>
            <!-- User Description -->
            <p class="description" id="userDescription">
                Hi! I am a professional photographer. I love capturing beautiful moments and sharing them with the world. Welcome to my smart portfolio!
            </p>
            
                <!-- Social Icons -->
            <div class="social-icons">
                <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn"><i class="fa-regular fa-envelope"></i> Email</button>
                <button class="action-btn"><i class="fa-solid fa-phone"></i> Call</button>
            </div>

            <!-- Image Gallery -->
            
        </div>
    </div>

    <!-- Script for NFC UID -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        if (uid) {
            document.getElementById('uidDisplay').innerText = uid;
        }
    </script>

</body>
</html>
